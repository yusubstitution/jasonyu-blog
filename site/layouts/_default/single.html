{{ define "main" }}
<article class="post">
  {{ if eq .Section "blog" }}
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="item-meta">{{ site.Title }} <span class="meta-delimiter">•</span> {{ .Date.Format "1/2/06" }}</div>
  </header>
  {{ end }}
  <div class="post-content">
    {{ .Content }}
  </div>
  {{ with .Params.tags }}
  <div class="post-tags">
    {{ range . }}<a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}
  </div>
  {{ end }}
</article>
{{ end }}
